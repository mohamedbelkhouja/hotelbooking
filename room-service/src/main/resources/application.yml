server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: room-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/chambres}
    username: ${DB_USER:room}
    password: ${DB_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true

grpc:
  server:
    port: ${GRPC_PORT:9090}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
